name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    name: Build and import (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install .

      - name: Import check
        run: |
          python -c "import qsim_sdk; print(qsim_sdk.Client)"

      - name: Serialise a circuit without contacting the API
        run: |
          python -c "
          from qiskit import QuantumCircuit
          from qsim_sdk import _to_qasm2
          qc = QuantumCircuit(2); qc.h(0); qc.cx(0,1); qc.measure_all()
          out = _to_qasm2(qc)
          assert 'OPENQASM 2.0' in out, out
          print('qasm2 serialisation ok')
          "

      # 0.4.0 shipped without Client.run: the package imported cleanly and every
      # check passed while the main entry point was absent. This asserts the
      # whole public surface is actually on the class.
      - name: Public surface is present
        run: |
          python -c "
          from qsim_sdk import Client
          expected = ('estimate', 'submit', 'job', 'run', 'submit_batch',
                      'run_batch', 'run_sweep', 'submit_sequence', 'run_sequence',
                      'submit_photonic', 'run_photonic')
          missing = [m for m in expected if not callable(getattr(Client, m, None))]
          assert not missing, f'missing from Client: {missing}'
          print('public surface ok:', len(expected), 'methods')
          "

      - name: Build a photonic program without perceval or the network
        run: |
          python -c "
          import json
          from qsim_sdk import _to_photonic
          prog = json.loads(_to_photonic(':PCVL:zip:stand-in-circuit', [1, 0, 1]))
          assert prog['circuit'] == ':PCVL:zip:stand-in-circuit', prog
          # The tag is the whole point: perceval's deserialize() passes an
          # unrecognised string through unchanged, so an untagged '|1,0,1>'
          # would reach the engine as a str and fail deep inside perceval.
          assert prog['input'] == ':PCVL:BasicState:|1,0,1>', prog
          print('photonic serialisation ok')
          "

  qiskit-versions:
    name: Qiskit compatibility
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        qiskit: ["1.*", "2.*"]

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install with pinned Qiskit
        run: |
          python -m pip install --upgrade pip
          pip install .
          pip install "qiskit==${{ matrix.qiskit }}"
      - name: Import and serialise
        run: |
          python -c "
          import qiskit
          from qiskit import QuantumCircuit
          from qsim_sdk import _to_qasm2
          print('qiskit', qiskit.__version__)
          qc = QuantumCircuit(2); qc.h(0); qc.cx(0,1); qc.measure_all()
          assert 'OPENQASM 2.0' in _to_qasm2(qc)
          print('ok')
          "

  build-dist:
    name: Build distributions
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: |
          python -m pip install --upgrade pip build twine
          python -m build
          python -m twine check dist/*
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
